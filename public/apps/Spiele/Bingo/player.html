<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Player - Numo MatheTrainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlays -->
    <div id="gameOverOverlay" class="modal-overlay">
        <h2 style="color: var(--danger);">AUSGESCHIEDEN</h2>
        <p class="description">Du hast keine Leben mehr. Du kannst aber noch zusehen!</p>
        <button class="btn btn-primary" onclick="location.reload()">Neustart</button>
    </div>



    <div id="rowOverlay" class="modal-overlay">
        <h2 style="color: var(--secondary-color);">REIHE VOLL!</h2>
        <p class="description">Du hast eine Reihe geschafft!</p>
        <button class="btn btn-primary" onclick="hideModal('rowOverlay')">Weiter spielen</button>
    </div>

    <div id="fullHouseOverlay" class="modal-overlay">
        <h2 style="color: var(--success);">SUPER BINGO!</h2>
        <p class="description">Du hast die ganze Karte voll!</p>
        <button class="btn btn-primary" onclick="location.reload()">Nochmal spielen</button>
    </div>

    <a href="index.html" class="back-button">
        <div class="icon">
            <img src="assets/Numo-logo-192x192.png" alt="Numo Logo">
        </div>
        <span class="label">Verlassen</span>
    </a>

    <div class="container">
        <!-- Stats Header -->
        <div class="stats-header">
            <div class="hearts" id="heartsContainer">
                <span class="heart">❤</span>
                <span class="heart">❤</span>
                <span class="heart">❤</span>
            </div>
            <div class="streak-counter" id="streakContainer">
                🔥 <span id="streakValue">0</span>
            </div>
        </div>

        <!-- Active Problem Display -->
        <div id="activeProblem" class="active-problem-banner">
            <p class="text-muted" style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700;">Aktuelle Aufgabe:</p>
            <h2 id="currentTermDisplay" style="font-size: 3.5rem; margin-top: 5px;">Warte...</h2>
        </div>

        <div id="waitingScreen">
            <p class="description" id="gameCodeDisplay">Spiel beigetreten</p>
            <p>Das Spiel startet, sobald der Host die erste Zahl zieht.</p>
        </div>

        <!-- The Bingo Card Grid -->
        <div id="gameScreen" class="hidden">
            <div class="bingo-card" id="bingoCard"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="game.js"></script>

</body>
</html>
