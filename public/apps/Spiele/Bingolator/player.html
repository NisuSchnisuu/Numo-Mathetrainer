<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingolator Player - Numo MatheTrainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlays -->
    <div id="gameOverOverlay" class="overlay hidden">
        <h2 style="color: var(--danger);">AUSGESCHIEDEN</h2>
        <p class="description">Du hast keine Leben mehr. Du kannst aber noch zusehen!</p>
        <button class="btn btn-primary" onclick="location.reload()">Neustart</button>
    </div>

    <div id="winOverlay" class="overlay hidden">
        <h2 style="color: var(--success);">BINGO!</h2>
        <p class="description">Du hast alle Zahlen auf deiner Karte gefunden!</p>
        <button class="btn btn-primary" onclick="location.reload()">Nochmal spielen</button>
    </div>

    <a href="index.html" class="back-button">
        <div class="icon">
            <img src="assets/Numo-logo-192x192.png" alt="Numo Logo">
        </div>
        <span class="label">Verlassen</span>
    </a>

    <div class="container">
        <!-- Stats Header -->
        <div class="stats-header">
            <div class="hearts" id="heartsContainer">
                <span class="heart">❤</span>
                <span class="heart">❤</span>
                <span class="heart">❤</span>
            </div>
            <div class="streak-counter" id="streakContainer">
                🔥 <span id="streakValue">0</span>
            </div>
        </div>

        <!-- Active Problem Display -->
        <div id="activeProblem" class="active-problem-banner">
            <p class="text-muted" style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700;">Aktuelle Aufgabe:</p>
            <h2 id="currentTermDisplay" style="font-size: 3.5rem; margin-top: 5px;">Warte...</h2>
        </div>

        <div id="waitingScreen">
            <p class="description" id="gameCodeDisplay">Spiel beigetreten</p>
            <p>Das Spiel startet, sobald der Host die erste Zahl zieht.</p>
        </div>

        <!-- The Bingo Card Grid -->
        <div id="gameScreen" class="hidden">
            <div class="bingo-card" id="bingoCard"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="game.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id');
            if (gameId) {
                document.getElementById('gameCodeDisplay').textContent = "Spiel-Code: " + gameId;
                playerJoinGame(gameId);
            }
        });

        function showPlayerGameView(card) {
            document.getElementById('waitingScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            renderBingoCard(card);
        }

        function renderBingoCard(card) {
            const grid = document.getElementById('bingoCard');
            grid.innerHTML = '';
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 9; c++) {
                    const value = card[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell' + (value === null ? ' empty' : '');
                    if (value !== null) {
                        cell.textContent = value;
                        cell.addEventListener('click', () => handleCellClick(value, cell));
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function updatePlayerProblem(term) {
            document.getElementById('currentTermDisplay').textContent = term;
        }

        function updatePlayerHearts() {
            const container = document.getElementById('heartsContainer');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart' + (i >= playerState.lives ? ' empty' : '');
                heart.textContent = '❤';
                container.appendChild(heart);
            }
        }

        function updatePlayerStreak() {
            document.getElementById('streakValue').textContent = playerState.streak;
            const container = document.getElementById('streakContainer');
            if (playerState.streak >= 3) {
                container.style.animation = 'pulse 1s infinite';
            } else {
                container.style.animation = 'none';
            }
        }
    </script>
</body>
</html>
